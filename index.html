<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Программа тренировок</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Golos+Text:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E6E4DE; --surface:#F4F3EF; --ink:#1F2429; --muted:#5E6468; --line:#C9C6BE;
  --red:#C8322B; --blue:#2D5DA8; --yellow:#E2AC1B; --green:#2F8A4C; --on-plate:#fff;
  --display:"Unbounded", "Arial Black", system-ui, sans-serif;
  --body:"Golos Text", "Segoe UI", system-ui, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1A1D20; --surface:#24282C; --ink:#EDEBE6; --muted:#A2A6A9; --line:#3A3F44;
    --red:#E0493F; --blue:#5B8BD8; --yellow:#F0BE3A; --green:#45A864;
  }
}
:root[data-theme="dark"]{
  --bg:#1A1D20; --surface:#24282C; --ink:#EDEBE6; --muted:#A2A6A9; --line:#3A3F44;
  --red:#E0493F; --blue:#5B8BD8; --yellow:#F0BE3A; --green:#45A864;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--blue);outline-offset:3px}

.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 20px;max-width:900px;margin:0 auto}
.brand{font-family:var(--display);font-weight:700;font-size:15px;background:none;border:0;padding:0;letter-spacing:.01em}
.hist-btn{border:2px solid var(--ink);background:transparent;border-radius:999px;padding:8px 16px;font-weight:600;font-size:15px}
.hist-btn:hover{background:var(--ink);color:var(--bg)}

main{max-width:900px;margin:0 auto;padding:12px 20px 110px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(34px,7vw,64px);line-height:1.02;margin:24px 0 16px;letter-spacing:-.01em}
h2{font-family:var(--display);font-weight:700;font-size:clamp(24px,4.5vw,34px);line-height:1.1;margin:8px 0 20px}
.lead{color:var(--muted);max-width:56ch;margin:0 0 32px}
.back{background:none;border:0;padding:6px 0;color:var(--muted);font-weight:500}
.back:hover{color:var(--ink)}
.screen{display:none}
.screen.on{display:block;animation:in .25s ease-out}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.screen.on{animation:none}}

.ask{background:var(--surface);border:2px solid var(--ink);border-radius:18px;padding:24px;max-width:560px}
.ask p{font-family:var(--display);font-weight:700;font-size:22px;margin:0 0 18px}
.row{display:flex;gap:12px;flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:14px 26px;font-weight:600;font-size:17px;background:var(--ink);color:var(--bg)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.btn:hover{filter:brightness(1.15)}

/* warmup table */
.tbl-wrap{overflow-x:auto;margin:0 0 28px}
table{border-collapse:collapse;width:100%;min-width:420px;background:var(--surface);border-radius:12px;overflow:hidden}
th,td{text-align:left;padding:12px 16px;border-bottom:1px solid var(--line)}
th{font-weight:600;color:var(--muted);font-size:14px}
.empty{background:var(--surface);border:2px dashed var(--line);border-radius:12px;padding:24px;color:var(--muted);margin-bottom:28px}

.praise{font-family:var(--display);font-weight:800;font-size:clamp(56px,14vw,120px);line-height:1;margin:40px 0 12px;color:var(--green)}

/* mode choice */
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.mode{text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:24px;min-height:170px;display:flex;flex-direction:column;justify-content:space-between}
.mode:hover{border-color:var(--ink)}
.mode b{font-family:var(--display);font-size:28px;font-weight:700}
.mode span{color:var(--muted)}

/* plates */
.plates{display:flex;gap:clamp(12px,3vw,28px);flex-wrap:wrap;align-items:flex-end}
.plate{border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:12px}
.disc{border-radius:50%;display:grid;place-items:center;color:var(--on-plate);font-family:var(--display);font-weight:800;position:relative;
  box-shadow:inset 0 0 0 8px rgba(0,0,0,.14), inset 0 0 0 16px rgba(255,255,255,.08);transition:transform .15s}
.disc::after{content:"";position:absolute;width:18%;height:18%;border-radius:50%;background:var(--bg);box-shadow:inset 0 0 0 3px rgba(0,0,0,.25)}
.disc em{font-style:normal;position:absolute;top:22%;font-size:clamp(14px,2.6vw,20px)}
.plate:hover .disc{transform:rotate(-12deg)}
.plate .name{font-weight:600;font-size:18px}
.plate .sub{color:var(--muted);font-size:14px;margin-top:-10px}
.d1{width:clamp(120px,24vw,160px);height:clamp(120px,24vw,160px);background:var(--green)}
.d2{width:clamp(140px,28vw,190px);height:clamp(140px,28vw,190px);background:var(--yellow)}
.d3{width:clamp(160px,32vw,220px);height:clamp(160px,32vw,220px);background:var(--red)}

/* groups */
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.group{text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:18px 20px}
.group:hover:not(:disabled){border-color:var(--ink)}
.group b{display:block;font-size:20px;font-weight:600}
.group span{color:var(--muted);font-size:14px}
.group:disabled{opacity:.5;cursor:not-allowed}

/* workout */
.tag-level{display:inline-block;border-radius:999px;padding:4px 12px;font-size:14px;font-weight:600;color:var(--on-plate)}
.ex{list-style:none;margin:0;padding:0;counter-reset:ex}
.ex > li{counter-increment:ex;display:grid;grid-template-columns:44px 1fr auto;gap:4px 14px;align-items:start;padding:18px 0;border-bottom:1px solid var(--line)}
.ex > li::before{content:counter(ex);font-family:var(--display);font-weight:800;font-size:26px;line-height:1.1;color:var(--muted);grid-row:span 2}
.ex .nm{font-weight:600;font-size:18px;line-height:1.3}
.ex .sr{font-family:var(--display);font-weight:700;font-size:20px;white-space:nowrap;text-align:right}
.ex .meta{grid-column:2 / 4;display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.int{font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;border:1.5px solid currentColor}
.int.light{color:var(--green)} .int.mid{color:var(--blue)} .int.heavy{color:var(--red)} .int.drop{color:var(--ink);background:var(--yellow);border-color:var(--yellow);color:#1F2429}
.sets{display:flex;gap:6px;flex-wrap:wrap}
.set{width:30px;height:30px;border-radius:50%;border:2px solid var(--ink);background:transparent;padding:0;font-size:12px;font-weight:600}
.set.done{background:var(--ink);color:var(--bg)}
.done-li .nm{text-decoration:line-through;color:var(--muted)}
.finish{margin-top:28px}
.progress{color:var(--muted);margin:0 0 8px}

/* history drawer */
.drawer{position:fixed;top:0;right:0;height:100%;width:min(380px,100%);background:var(--surface);border-left:2px solid var(--ink);
  padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(105%);transition:transform .25s;z-index:20;overflow-y:auto}
.drawer.open{transform:none}
@media (prefers-reduced-motion:reduce){.drawer{transition:none}}
.drawer h3{font-family:var(--display);font-size:20px;margin:0 0 16px}
.drawer ul{list-style:none;padding:0;margin:0}
.drawer li{padding:12px 0;border-bottom:1px solid var(--line)}
.drawer li b{display:block}
.drawer li span{color:var(--muted);font-size:14px}
.drawer .x{position:absolute;right:16px;top:calc(14px + env(safe-area-inset-top,0px));background:none;border:0;font-size:26px;line-height:1}
.shade{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:15;display:none}
.shade.open{display:block}

.author{position:fixed;left:0;bottom:0;padding:10px 20px calc(10px + env(safe-area-inset-bottom,0px));font-size:13px;color:var(--muted);background:var(--bg);border-top-right-radius:12px;z-index:5}
.author b{color:var(--ink);font-weight:600}
.author-q{background:none;border:0;padding:0 0 4px;color:var(--blue);font-weight:600;font-size:13px;text-decoration:underline;text-underline-offset:3px}
.author-pop{position:absolute;left:12px;bottom:calc(100% + 8px);width:min(340px,calc(100vw - 24px));background:var(--surface);border:2px solid var(--ink);border-radius:14px;padding:18px;color:var(--ink);font-size:15px}
.author-pop[hidden]{display:none}
.ap-h{font-family:var(--display);font-weight:700;font-size:16px;margin:0 0 10px}
.author-pop ol{margin:0 0 14px;padding-left:20px}
.author-pop li{padding:4px 0}
.author-pop li span{color:var(--muted);white-space:nowrap}
.author-pop .btn{padding:10px 18px;font-size:15px}

.top-r{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.seg{display:inline-flex;border:2px solid var(--ink);border-radius:999px;overflow:hidden}
.seg button{border:0;background:transparent;padding:6px 12px;font-weight:600;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.w-note{color:var(--muted);font-size:14px;margin:-16px 0 20px}
td.num{font-family:var(--display);font-weight:700;color:var(--muted);width:44px}
td .cue{display:block;color:var(--muted);font-size:14px;margin-top:2px}
td .warn{display:block;color:var(--red);font-size:14px;margin-top:2px}
.h-count{color:var(--muted);font-size:14px;margin:-8px 0 8px}
.reset{margin-top:24px}
.reset p{margin:0 0 12px;font-weight:600}
.btn.danger{color:var(--red);box-shadow:inset 0 0 0 2px var(--red)}
.btn.danger-fill{background:var(--red);color:#fff}
[hidden]{display:none !important}
.exfig{width:100%;height:auto;display:block;background:#fbfbf9;border-radius:12px}
.exfig .skin{fill:url(#gSkin);stroke:#7c858d;stroke-width:1.1;stroke-linejoin:round}
.exfig .skin.far{fill:url(#gFar);stroke:#89929a}
.exfig .shoe{fill:#3c434a;stroke:#2a2f34;stroke-width:1}
.exfig .shoe.far{fill:#5a626a}
.exfig .sole{stroke:#e8b62c;stroke-width:1.6;fill:none;stroke-linecap:round}
.exfig .hair{fill:#6f777e}
.exfig .ear{fill:#d3d8dc;stroke:#7c858d;stroke-width:.9}
.exfig .cont{fill:none;stroke:#8e979e;stroke-width:.9;stroke-linecap:round;opacity:.7}
.exfig .mus{fill:url(#gMus);stroke:#9e2219;stroke-width:.8}
.exfig .fib{stroke:#f4a49d;stroke-width:.9;opacity:.7;fill:none;stroke-linecap:round}
.exfig .frame{fill:url(#gFrame);stroke:#8b939a;stroke-width:1}
.exfig .pad{fill:#353b41;stroke:#1f2428;stroke-width:1}
.exfig .pad-hi{stroke:#59616a;stroke-width:1.4;fill:none;stroke-linecap:round}
.exfig .pad-hi2{fill:none;stroke:#59616a;stroke-width:1.2}
.exfig .steel{stroke:#7d858c;fill:none;stroke-linecap:round}
.exfig .steel-f{fill:#a9b0b6;stroke:#6c747b;stroke-width:.9}
.exfig .plate{fill:#23282d;stroke:#15191c;stroke-width:1}
.exfig .plate-ring{fill:none;stroke:#4c545b;stroke-width:1.6}
.exfig .rubber{fill:#2b3035}
.exfig .cable{stroke:#2b3035;stroke-width:1.4}
.exfig .floor{stroke:#b9bec2;stroke-width:1.5}
.exfig .shadow{fill:#000;opacity:.07}
.exfig .arrow path{fill:none;stroke:#9aa1a7;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.exfig .num circle{fill:#2b3035}
.exfig .num text{fill:#fff;font:700 13px system-ui,sans-serif;text-anchor:middle}
.exfig .shorts{fill:#4a5561;stroke:#343c45;stroke-width:1}
.exfig .shorts.far{fill:#5d6874}
.exfig .band{stroke:#2e353d;stroke-width:2.2;stroke-linecap:round;fill:none}
.exfig .eye{fill:#3f464c}
.exfig .face{fill:none;stroke:#6f777e;stroke-width:.9;stroke-linecap:round}
.exfig .hole{fill:#4c545b}
.exfig .rod{stroke:#9aa1a7;stroke-width:1.4}
.exfig .face.soft{stroke:#9aa2a9}

.fig-box{margin:12px 0 0}
.fig-box img{display:block;width:100%;max-width:420px;height:auto;border-radius:12px;margin:0 auto;background:#fff}
.mus-chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0 0;font-size:14px}
.mus-chips span{color:var(--muted);font-weight:600}
.mus-chips i{font-style:normal;background:#d23a2f;color:#fff;border-radius:999px;padding:2px 10px;font-weight:600;font-size:13px}
.tech-btn{grid-column:2 / 4;justify-self:start;background:none;border:0;padding:4px 0;color:var(--blue);font-weight:600;font-size:15px;text-decoration:underline;text-underline-offset:3px}
.tech{grid-column:1 / 4;background:var(--surface);border-radius:14px;padding:16px;margin-top:6px}
.tech img{display:block;width:100%;max-width:420px;height:auto;border-radius:10px;margin:0 auto 12px;background:#fff}
.tech ul{margin:0;padding-left:20px}
.tech ul li{padding:3px 0}
@media (max-width:560px){.brand{font-size:13px}.hist-btn{padding:6px 12px;font-size:14px}}
</style>
</head>
<body>
<header class="top">
  <button class="brand" id="home" data-i18n="brand"></button>
  <div class="top-r">
    <div class="seg" role="group" aria-label="Язык / Language">
      <button data-lang="ru">RU</button><button data-lang="en">EN</button>
    </div>
    <div class="seg" role="group" id="themeSeg">
      <button data-theme-set="light" data-i18n="light"></button><button data-theme-set="dark" data-i18n="dark"></button>
    </div>
    <button class="hist-btn" id="histOpen" data-i18n="history"></button>
  </div>
</header>

<main>
  <section class="screen on" id="s-warm">
    <h1 data-i18n="warmH"></h1>
    <p class="lead" data-i18n="warmLead"></p>
    <div class="ask">
      <p data-i18n="warmQ"></p>
      <div class="row">
        <button class="btn" data-go="level" data-i18n="yes"></button>
        <button class="btn ghost" data-go="warmtable" data-i18n="no"></button>
      </div>
    </div>
  </section>

  <section class="screen" id="s-warmtable">
    <button class="back" data-go="warm" data-i18n="back"></button>
    <h2 data-i18n="warmT"></h2>
    <p class="w-note" data-i18n="warmNote"></p>
    <div id="warmBox"></div>
    <button class="btn" data-go="praise" data-i18n="warmDone"></button>
  </section>

  <section class="screen" id="s-praise">
    <div class="praise" data-i18n="praise"></div>
    <p class="lead" data-i18n="praiseLead"></p>
    <button class="btn" data-go="level" data-i18n="toWorkout"></button>
  </section>

  <section class="screen" id="s-level">
    <button class="back" data-go="warm" data-i18n="back"></button>
    <h2 data-i18n="levelH"></h2>
    <div class="plates">
      <button class="plate" data-level="начальный"><span class="disc d1"><em>10</em></span><span class="name" data-i18n="lv_начальный"></span><span class="sub" data-i18n="lvs1"></span></button>
      <button class="plate" data-level="средний"><span class="disc d2"><em>15</em></span><span class="name" data-i18n="lv_средний"></span><span class="sub" data-i18n="lvs2"></span></button>
      <button class="plate" data-level="высокий"><span class="disc d3"><em>25</em></span><span class="name" data-i18n="lv_высокий"></span><span class="sub" data-i18n="lvs3"></span></button>
    </div>
  </section>

  <section class="screen" id="s-group">
    <button class="back" data-go="level" data-i18n="back"></button>
    <h2 id="groupTitle"></h2>
    <div class="groups" id="groups"></div>
  </section>

  <section class="screen" id="s-work">
    <button class="back" data-go="group" data-i18n="back"></button>
    <h2 id="workTitle"></h2>
    <p class="progress" id="progress"></p>
    <ol class="ex" id="exList"></ol>
    <div class="finish row"><button class="btn" id="finish" data-i18n="finish"></button></div>
  </section>

  <section class="screen" id="s-saved">
    <div class="praise" data-i18n="saved"></div>
    <p class="lead" id="savedText"></p>
    <div class="row">
      <button class="btn" id="histOpen2" data-i18n="history"></button>
      <button class="btn ghost" data-go="warm" data-i18n="toHome"></button>
    </div>
  </section>
</main>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>
<linearGradient id="gSkin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f1f3f4"/><stop offset=".55" stop-color="#dde1e4"/><stop offset="1" stop-color="#c3c9ce"/></linearGradient>
<linearGradient id="gFar" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c9ced3"/><stop offset="1" stop-color="#a8afb5"/></linearGradient>
<linearGradient id="gMus" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ef5a4f"/><stop offset=".6" stop-color="#d23a2f"/><stop offset="1" stop-color="#a92419"/></linearGradient>
<linearGradient id="gFrame" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dfe2e4"/></linearGradient>
</defs></svg>

<div class="shade" id="shade"></div>
<aside class="drawer" id="drawer">
  <button class="x" id="histClose" aria-label="×">×</button>
  <h3 data-i18n="histH"></h3>
  <p class="h-count" id="histCount"></p>
  <ul id="histList"></ul>
  <div class="reset" id="resetBox">
    <button class="btn ghost danger" id="resetBtn" data-i18n="reset"></button>
    <div id="resetAsk" hidden>
      <p data-i18n="resetQ"></p>
      <div class="row"><button class="btn danger-fill" id="resetYes" data-i18n="resetYes"></button><button class="btn ghost" id="resetNo" data-i18n="resetNo"></button></div>
    </div>
  </div>
</aside>

<div class="author">
  <div class="author-pop" id="authorPop" hidden>
    <p class="ap-h" data-i18n="authorH"></p>
    <ol id="authorList"></ol>
  </div>
  <button class="author-q" id="authorBtn" aria-expanded="false" aria-controls="authorPop" data-i18n="authorQ"></button>
  <div><span data-i18n="author"></span> <b data-i18n="authorName"></b></div>
</div>

<script>
/* ===== ОБЩЕСУСТАВНАЯ РАЗМИНКА (по видео) ===== */
const WARMUP = [
  {ru:["Повороты головы влево-вправо","Медленно, без рывков, руки за спиной"], en:["Head turns left and right","Slow and controlled, hands behind your back"], reps:"10"},
  {ru:["Руки вверх и в стороны","Локти смотрят вниз"], en:["Arms overhead and out to the sides","Elbows point down"], reps:"10"},
  {ru:["Вращения в плечевых суставах","Руки в стороны, круги по большой амплитуде"], en:["Shoulder circles","Arms out to the sides, big circles"], reps:"10 + 10"},
  {ru:["Вращения кистями и локтями","Кисти в замке перед грудью"], en:["Wrist and elbow circles","Hands clasped in front of the chest"], reps:"10 + 10"},
  {ru:["Скручивания корпуса","Таз стоит на месте"], en:["Torso twists","Keep your hips still"], reps:"10"},
  {ru:["Наклоны в стороны","!Не рекомендуется при протрузиях и грыжах"], en:["Side bends","!Not recommended with disc protrusions or hernias"], reps:"10"},
  {ru:["Наклоны вперёд к носкам","Колени мягкие, спина без рывков"], en:["Forward bends to the toes","Soft knees, no jerking"], reps:"10"},
  {ru:["Глубокий присед с руками вперёд","Пятки на полу, раскачивайся в нижней точке"], en:["Deep squat, arms forward","Heels down, rock gently at the bottom"], reps:"30 сек|30 sec"},
  {ru:["Разведения и вращения рук с лёгкими гантелями","Для вращательной манжеты плеча"], en:["Light dumbbell raises and rotations","Warms up the rotator cuff"], reps:"10"},
  {ru:["Выпады с опорой на руки","Перенос веса с ноги на ногу, раскрываем тазобедренные суставы"], en:["Lunges with hands on the floor","Shift weight leg to leg, open up the hips"], reps:"5 + 5"},
];

/* ===== ПРОГРАММА АВТОРА (фулбади) ===== */
const AUTHOR = [
  ["Тяга верхнего блока","4х8-12"],

/* ===== ИЛЛЮСТРАЦИИ УПРАЖНЕНИЙ: рисуются кодом (SVG) ===== */
const FIG = (()=>{
const R = Math.PI/180;
const LEN = {torso:50, ua:28, fa:25, th:40, sh:38};
const add=(p,q)=>[p[0]+q[0],p[1]+q[1]], sub=(p,q)=>[p[0]-q[0],p[1]-q[1]], mul=(p,k)=>[p[0]*k,p[1]*k];
const len=v=>Math.hypot(v[0],v[1]), unit=v=>{const l=len(v)||1;return [v[0]/l,v[1]/l];};
const D = a => [Math.sin(a*R), Math.cos(a*R)];           // угол от вертикали вниз, «+» = вперёд
const ang = v => Math.atan2(v[1],v[0])/R;
const f1 = n => Math.round(n*10)/10, P = p => f1(p[0])+","+f1(p[1]);
let UID = 0; const ISSUES = [];

function smooth(pts, closed=true){
  const n=pts.length; let d="M"+P(pts[0]);
  const last = closed ? n : n-1;
  for(let i=0;i<last;i++){
    const p1=pts[i], p2=pts[(i+1)%n];
    const p0 = (!closed && i===0) ? p1 : pts[(i-1+n)%n];
    const p3 = (!closed && i===n-2) ? p2 : pts[(i+2)%n];
    const c1=[p1[0]+(p2[0]-p0[0])/6, p1[1]+(p2[1]-p0[1])/6], c2=[p2[0]-(p3[0]-p1[0])/6, p2[1]-(p3[1]-p1[1])/6];
    d+=" C"+P(c1)+" "+P(c2)+" "+P(p2);
  }
  return d+(closed?"Z":"");
}
// обратная кинематика: sign — в какую сторону гнётся сустав (колено +1, локоть −1)
function ik(base, target, l1, l2, sign){
  const dv=sub(target,base), d=len(dv);
  const dc=Math.min(Math.max(d,Math.abs(l1-l2)+.01),l1+l2-.01);
  const a=Math.atan2(dv[1],dv[0]), off=Math.acos((l1*l1+dc*dc-l2*l2)/(2*l1*dc));
  const sols=[1,-1].map(s=>{
    const j=add(base,[Math.cos(a+s*off)*l1, Math.sin(a+s*off)*l1]);
    const e=add(j,mul(unit(sub(target,j)),l2));
    const v1=sub(j,base), v2=sub(e,j);
    return {j,e,cr:v1[0]*v2[1]-v1[1]*v2[0]};
  });
  return sols.find(x=>Math.sign(x.cr)===sign) || sols[0];
}
// органичная форма конечности по профилю радиусов (спереди / сзади)
function limb(a,b,rf,rb){
  const u=unit(sub(b,a)), n=[u[1],-u[0]], L=len(sub(b,a)), ts=[0,.2,.45,.72,1];
  const at=(t,r)=>add(add(a,mul(u,L*t)),mul(n,r));
  const pts=[add(a,mul(u,-rf[0]*.85))];
  ts.forEach((t,i)=>pts.push(at(t,rf[i])));
  pts.push(add(b,mul(u,rf[4]*.85)));
  for(let i=ts.length-1;i>=0;i--) pts.push(at(ts[i],-rb[i]));
  return smooth(pts);
}
const PROF = {
  ua:[[6.2,6.8,7.2,5.8,4.6],[6.4,7.2,6.6,5.2,4.6]],
  fa:[[4.9,5.4,4.6,3.4,3],[4.9,5.2,4.3,3.3,3]],
  th:[[9.5,9.6,8.8,7,6],[10,9.4,8.2,6.6,6]],
  sh:[[5.6,5.2,4.4,3.6,3.3],[5.8,7.2,6.4,4,3.4]],
};
const clipDef=(id,d)=>`<clipPath id="${id}"><path d="${d}"/></clipPath>`;
const mel=(c,rx,ry,a,clip)=>`<ellipse class="mus" cx="${f1(c[0])}" cy="${f1(c[1])}" rx="${f1(rx)}" ry="${f1(ry)}" transform="rotate(${f1(a)} ${f1(c[0])} ${f1(c[1])})"${clip?` clip-path="url(#${clip})"`:""}/>`;
const pth=(d,cls)=>`<path class="${cls}" d="${d}"/>`;
const circ=(c,r,cls)=>`<circle class="${cls}" cx="${f1(c[0])}" cy="${f1(c[1])}" r="${r}"/>`;
const lin=(a,b,cls,w)=>`<line class="${cls}" x1="${f1(a[0])}" y1="${f1(a[1])}" x2="${f1(b[0])}" y2="${f1(b[1])}"${w?` stroke-width="${w}"`:""}/>`;
function limbMuscle(a,b,side,t0,t1,wr,clip){
  const u=unit(sub(b,a)), n=[u[1],-u[0]], L=len(sub(b,a));
  const c=add(add(a,mul(u,L*(t0+t1)/2)),mul(n,side*wr*.55));
  return mel(c,L*(t1-t0)/2,wr*.85,ang(u),clip)
    + `<path class="fib" d="M${P(add(c,mul(u,-L*(t1-t0)*.3)))} L${P(add(c,mul(u,L*(t1-t0)*.3)))}" clip-path="url(#${clip})"/>`;
}

function detail(a,b,t0,t1,off){
  const u=unit(sub(b,a)), n=[u[1],-u[0]], L=len(sub(b,a));
  const p=t=>add(add(a,mul(u,L*t)),mul(n,off*(1-Math.abs(t-(t0+t1)/2))));
  return `<path class="cont" d="M${P(p(t0))} Q${P(p((t0+t1)/2))} ${P(p(t1))}"/>`;
}
/* ---------------- ВИД СБОКУ ---------------- */
function sideJ(p){
  const J={}, t=p.t||0;
  J.hip=p.hip; J.u=[Math.sin(t*R),-Math.cos(t*R)]; J.nf=[-J.u[1],J.u[0]];
  J.sh=add(J.hip,mul(J.u,LEN.torso));
  J.hd=t+(p.head||0);
  J.head=add(J.sh,mul([Math.sin(J.hd*R),-Math.cos(J.hd*R)],17));
  const leg=(hip,ankle,knee)=> knee ? {k:knee,a:ankle} : (r=>({k:r.j,a:r.e}))(ik(hip,ankle,LEN.th,LEN.sh,1));
  const arm=(sh,hand,el,wr)=> el ? {el,wr} : (r=>({el:r.j,wr:r.e}))(ik(sh,hand,LEN.ua,LEN.fa,-1));
  const l=leg(J.hip,p.ankle,p.knee); J.knee=l.k; J.ankle=l.a; J.foot=p.foot??90;
  const pe = typeof p.elbow==="function" ? p.elbow(J) : p.elbow, pw = typeof p.wrist==="function" ? p.wrist(J) : p.wrist;
  const a=arm(J.sh,p.hand,pe,pw); J.el=a.el; J.wr=a.wr;
  J.hv = p.handDir!=null ? D(p.handDir) : unit(sub(J.wr,J.el));
  J.grip=add(J.wr,mul(J.hv,4.5));
  const fo=p.farOff||[-3,-2];
  J.fhip=add(J.hip,fo); J.fsh=add(J.sh,fo);
  const fl=leg(J.fhip, p.farAnkle||add(J.ankle,[-7,0]), p.farKnee); J.fknee=fl.k; J.fankle=fl.a; J.ffoot=p.farFoot??J.foot;
  const fa=arm(J.fsh, p.farHand||add(J.wr,fo), pe?add(pe,fo):null, pw?add(pw,fo):null);
  J.fel=fa.el; J.fwr=fa.wr; J.fhv = p.handDir!=null ? D(p.handDir) : unit(sub(J.fwr,J.fel));
  return J;
}
function torsoSide(J){
  const at=(s,o)=>add(add(J.hip,mul(J.u,LEN.torso*s)),mul(J.nf,o));
  return {d:smooth([at(-.1,-2),at(-.02,9.5),at(.3,8.5),at(.52,10.5),at(.74,13.5),at(.92,11.5),at(1.06,5),at(1.08,-5),at(.96,-11.5),at(.72,-12.8),at(.4,-9.8),at(.18,-11.5),at(.02,-13.5)]), at};
}
function shoe(ankle,fa,cls){
  const f=D(fa), up=[f[1],-f[0]];
  const pt=(a,b)=>add(add(ankle,mul(f,a)),mul(up,b));
  return pth(smooth([pt(-5,-5.5),pt(4,-6),pt(15,-5.5),pt(17.5,-2.5),pt(15,.8),pt(8,3.2),pt(3,6.5),pt(-3.5,6),pt(-6,.5)]),cls)
    + `<path class="sole" d="M${P(pt(-5.5,-5))} L${P(pt(16.5,-4.8))}"/>`;
}
function hand(wr,hv,cls){
  const c=add(wr,mul(hv,4.2)), a=ang(hv), n=[hv[1],-hv[0]], th=add(add(wr,mul(hv,3)),mul(n,3.4));
  return `<ellipse class="${cls}" cx="${f1(th[0])}" cy="${f1(th[1])}" rx="3.2" ry="1.9" transform="rotate(${f1(a-35)} ${f1(th[0])} ${f1(th[1])})"/>`
    + `<ellipse class="${cls}" cx="${f1(c[0])}" cy="${f1(c[1])}" rx="5.6" ry="4" transform="rotate(${f1(a)} ${f1(c[0])} ${f1(c[1])})"/>`
    + `<path class="cont" d="M${P(add(add(c,mul(hv,2.2)),mul(n,2.6)))} L${P(add(add(c,mul(hv,2.2)),mul(n,-2.6)))}"/>`;
}
function headSide(J){
  const c=J.head, a=J.hd, f=[Math.cos(a*R),Math.sin(a*R)], up=[Math.sin(a*R),-Math.cos(a*R)];
  const pt=(x,y)=>add(add(c,mul(f,x)),mul(up,y));
  const id="h"+(++UID);
  const head=smooth([pt(-9.5,2),pt(-8,8),pt(0,11.5),pt(7,9),pt(9.6,3),pt(10.2,-.5),pt(12.4,-2.8),pt(10,-5),pt(9.4,-8.6),pt(5.5,-11.6),pt(0,-11.8),pt(-7,-8)]);
  const hc=pt(-3.5,6);
  return `<defs>${clipDef(id,head)}</defs>`+pth(head,"skin")
   + `<ellipse class="hair" cx="${f1(hc[0])}" cy="${f1(hc[1])}" rx="11.5" ry="8" clip-path="url(#${id})" transform="rotate(${f1(a)} ${f1(hc[0])} ${f1(hc[1])})"/>`
   + (e=>`<ellipse class="ear" cx="${f1(e[0])}" cy="${f1(e[1])}" rx="2.2" ry="3.2" transform="rotate(${f1(a)} ${f1(e[0])} ${f1(e[1])})"/>`)(pt(-1.5,-.5))
   + (e=>`<ellipse class="eye" cx="${f1(e[0])}" cy="${f1(e[1])}" rx="1" ry="1.35"/>`)(pt(6.3,1.6))
   + `<path class="face" d="M${P(pt(4.2,4.2))} Q${P(pt(6.5,5.2))} ${P(pt(8.8,4))} M${P(pt(8.6,-6.6))} L${P(pt(10.3,-6.2))} M${P(pt(1,-9.5))} Q${P(pt(5,-11.6))} ${P(pt(8.6,-10.4))}"/>`;
}
function shortsTorso(d,J,tid){
  const at=(s,o)=>add(add(J.hip,mul(J.u,LEN.torso*s)),mul(J.nf,o));
  const id="sb"+(++UID);
  return `<defs><clipPath id="${id}"><path d="M${P(at(.24,-40))} L${P(at(.24,40))} L${P(at(-.6,40))} L${P(at(-.6,-40))}Z"/></clipPath></defs><g clip-path="url(#${id})"><path class="shorts" d="${d}"/></g>`
   + `<path class="band" d="M${P(at(.24,-12.2))} L${P(at(.24,9.2))}"/>`;
}
function drawSide(p,mus){
  const J=sideJ(p), hl=m=>mus.includes(m);
  let s="", defs="";
  const legShape=(hip,knee,ankle,foot,cls)=>{
    const th=limb(hip,knee,...PROF.th), shn=limb(knee,ankle,...PROF.sh);
    const far=cls.includes("far");
    const sh=limb(hip,add(hip,mul(sub(knee,hip),.52)),[10.3,10.4,9.8,9.2,9],[10.8,10.2,9.6,9,8.8]);
    return {th,shn,svg:shoe(ankle,foot,"shoe"+(far?" far":""))+pth(shn,cls)+pth(th,cls)+pth(sh,"shorts"+(far?" far":""))};
  };
  const armShape=(sh,el,wr,hv,cls)=>{
    const ua=limb(sh,el,...PROF.ua), fa=limb(el,wr,...PROF.fa);
    return {ua,fa,svg:pth(fa,cls)+hand(wr,hv,cls)+pth(ua,cls)};
  };
  if(p.farLeg!==false) s+=legShape(J.fhip,J.fknee,J.fankle,J.ffoot,"skin far").svg;
  if(p.farArm!==false) s+=armShape(J.fsh,J.fel,J.fwr,J.fhv,"skin far").svg;
  if(p.gripBack) s+=grip(p,J);
  const T=torsoSide(J), tid="t"+(++UID); defs+=clipDef(tid,T.d);
  const tA=ang(J.u);
  s+=pth(smooth([add(J.sh,mul(J.nf,-6)),add(J.sh,mul(J.nf,5)),add(J.head,mul(J.nf,2)),add(J.head,mul(J.nf,-5))]),"skin");
  s+=pth(T.d,"skin");
  s+=pth(smooth([T.at(.64,13),T.at(.6,6),T.at(.66,0)],false),"cont");
  s+=pth(smooth([T.at(.95,-10.5),T.at(.8,-7),T.at(.68,-9)],false),"cont");
  if(hl("chest")) s+=`<path class="mus" clip-path="url(#${tid})" d="${smooth([T.at(.97,5),T.at(.99,12.5),T.at(.84,15),T.at(.64,12.8),T.at(.6,5),T.at(.8,1.5)])}"/>`+`<path class="fib" clip-path="url(#${tid})" d="M${P(T.at(.93,4))} L${P(T.at(.72,12))}"/>`;
  if(hl("lats")) s+=`<path class="mus" clip-path="url(#${tid})" d="${smooth([T.at(.9,-6),T.at(.86,-13.5),T.at(.6,-12.5),T.at(.36,-10),T.at(.5,-6.5),T.at(.74,-4.5)])}"/>`;
  if(hl("upperback")) s+=mel(T.at(.86,-10),9,6.5,tA,tid);
  if(hl("traps")) s+=mel(T.at(1.03,-6),8,5.5,tA,tid);
  s+=shortsTorso(T.d,J,tid);
  if(hl("glutes")) s+=mel(T.at(.04,-8),10,9,tA,tid);
  s+=headSide(J);
  const lg=legShape(J.hip,J.knee,J.ankle,J.foot,"skin");
  s+=lg.svg;
  const thid="q"+(++UID), shid="c"+(++UID); defs+=clipDef(thid,lg.th)+clipDef(shid,lg.shn);
  if(hl("quads")) s+=limbMuscle(J.hip,J.knee,1,.12,.86,9,thid);
  if(hl("hams")) s+=limbMuscle(J.hip,J.knee,-1,.14,.88,9,thid);
  if(hl("calves")) s+=limbMuscle(J.knee,J.ankle,-1,.08,.6,6.5,shid);
  s+=detail(J.hip,J.knee,.3,.85,3.5)+detail(J.knee,J.ankle,.12,.55,-3.2);
  const ku=unit(sub(J.ankle,J.knee)), kn=[ku[1],-ku[0]];
  s+=pth(smooth([add(add(J.knee,mul(kn,4.5)),mul(ku,-3)),add(add(J.knee,mul(kn,6)),mul(ku,1)),add(add(J.knee,mul(kn,4.5)),mul(ku,4))],false),"cont");
  if(p.gripBehindArm) s+=grip(p,J);
  const ar=armShape(J.sh,J.el,J.wr,J.hv,"skin"); s+=ar.svg;
  s+=detail(J.sh,J.el,.35,.85,0)+detail(J.el,J.wr,.1,.5,1.5);
  const uid="a"+(++UID), fid="f"+(++UID); defs+=clipDef(uid,ar.ua)+clipDef(fid,ar.fa);
  if(hl("biceps")) s+=limbMuscle(J.sh,J.el,1,.24,.9,6.8,uid);
  if(hl("triceps")) s+=limbMuscle(J.sh,J.el,-1,.2,.92,6.8,uid);
  if(hl("forearms")) s+=limbMuscle(J.el,J.wr,0,.05,.62,5.2,fid);
  const uv=unit(sub(J.el,J.sh)), cap=add(J.sh,mul(uv,5)), nA=[uv[1],-uv[0]];
  const did="d"+(++UID), capPath=limb(add(J.sh,mul(uv,-3)),add(J.sh,mul(uv,13)),[7.5,8.5,8.4,6.5,2.5],[7.5,8.8,8.6,6.8,2.5]);
  defs+=clipDef(did,capPath);

  if(hl("delt_front")) s+=mel(add(cap,mul(nA,5)),8,6,ang(uv),did);
  if(hl("delt_side")) s+=mel(cap,9,8,ang(uv),did);
  if(hl("delt_rear")) s+=mel(add(cap,mul(nA,-5)),8,6,ang(uv),did);

  return {svg:`<defs>${defs}</defs>`+s, J};
}

/* ---------------- ВИД СПЕРЕДИ / СЗАДИ ---------------- */
function drawFront(p,mus){
  const cx=p.cx??100, hy=p.hipY??112, e=p.shrug||0, rear=!!p.rear, hl=m=>mus.includes(m);
  const shY=hy-48-e;
  let s="", defs="";
  const mir=(pt,side)=>[cx+side*(pt[0]-cx),pt[1]];
  const armPts=side=>{
    const A=(side<0&&p.armL)?p.armL:p.arm;
    const shp=[cx+side*19,shY+4];
    const el=mir([cx+A.el[0],shY+A.el[1]],side), wr=mir([cx+A.wr[0],shY+A.wr[1]],side);
    const hv=unit(sub(wr,el));
    return {shp,el,wr,hv,grip:add(wr,mul(hv,4.5)),A};
  };
  const legPts=side=>{
    const L=p.leg||{knee:[10.5,42],ankle:[12,190]};
    return {hp:[cx+side*9.5,hy+2],kn:mir([cx+L.knee[0],hy+L.knee[1]],side),an:mir([cx+L.ankle[0],L.ankle[1]],side)};
  };
  const sides=[-1,1];
  const drawArm=(side)=>{
    const a=armPts(side); let o="";
    if(a.A.hidden) return "";
    const ua=limb(a.shp,a.el,[6.4,7,6.6,5.4,4.6],[6.4,7,6.6,5.4,4.6]), fa=limb(a.el,a.wr,[5,5.3,4.5,3.4,3],[5,5.3,4.5,3.4,3]);
    o+=pth(fa,"skin")+hand(a.wr,a.hv,"skin")+pth(ua,"skin");
    const id="fa"+(++UID); defs+=clipDef(id,ua);
    if(hl("biceps")&&!rear) o+=limbMuscle(a.shp,a.el,0,.25,.92,6.6,id);
    if(hl("triceps")&&rear) o+=limbMuscle(a.shp,a.el,0,.2,.92,6.6,id);

  if(r>14) for(const a of [30,150,270]) s+=circ(add(c,[Math.cos(a*R)*r*.56,Math.sin(a*R)*r*.56]),r*.13,"hole");

function check(name,idx,J,spec){

  if(!spec.noArmCheck) bad(cr(J.sh,J.el,J.wr)>0.1,"локоть выгнут назад");
  bad(cr(J.hip,J.knee,J.ankle)<-0.1,"колено выгнуто назад");
  bad(cr(J.fhip,J.fknee,J.fankle)<-0.1,"дальнее колено выгнуто");
  if(!spec.noArmCheck) bad(cr(J.fsh,J.fel,J.fwr)>0.1,"дальний локоть выгнут");
  const sole=J.ankle[1]+6*Math.abs(Math.sin(J.foot*R));
  if(!spec.air) bad(Math.abs(sole-196)>3.5 && !spec.noFloor,"стопа не на полу: "+f1(sole));

const LEVEL_COLOR = {"начальный":"var(--green)","средний":"var(--yellow)","высокий":"var(--red)"};
const $ = id => document.getElementById(id);
const store = {get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let lang = store.get("lang") === "en" ? "en" : "ru";
let state = {level:null, group:null};

function t(k, v={}){ let s = T[lang][k] ?? k; for(const x in v) s = s.replace("{"+x+"}", v[x]); return s; }
const exName = n => lang==="en" ? (EX_EN[n]||n) : n;
const lvName = l => t("lv_"+l);
const gName = g => T[lang].g[g] || g;
const workTitle = (g,l) => `${gName(g)}, ${lang==="ru" ? lvName(l).toLowerCase()+" уровень" : lvName(l).toLowerCase()}`;

function show(name){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("on"));
  $("s-"+name).classList.add("on");
  window.scrollTo(0,0);
}
document.addEventListener("click", e=>{ const g = e.target.closest("[data-go]"); if(g) show(g.dataset.go); });
$("home").onclick = ()=>show("warm");

/* theme */
function applyTheme(th){
  if(!th) th = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  document.documentElement.setAttribute("data-theme", th);
  document.querySelectorAll("[data-theme-set]").forEach(b=>b.setAttribute("aria-pressed", b.dataset.themeSet===th));
}
document.querySelectorAll("[data-theme-set]").forEach(b=>b.onclick=()=>{ store.set("theme", b.dataset.themeSet); applyTheme(b.dataset.themeSet); });
applyTheme(store.get("theme"));

/* language */
function applyLang(){
  document.documentElement.lang = lang;
  document.title = t("brand");
  document.querySelectorAll("[data-i18n]").forEach(el=>el.textContent = t(el.dataset.i18n));
  document.querySelectorAll("[data-lang]").forEach(b=>b.setAttribute("aria-pressed", b.dataset.lang===lang));
  $("themeSeg").setAttribute("aria-label", lang==="ru" ? "Тема" : "Theme");
  renderWarm(); renderAuthor(); renderHist();
  if(state.level) renderGroups();
  if(state.group) renderWorkout(true);
}
document.querySelectorAll("[data-lang]").forEach(b=>b.onclick=()=>{ lang = b.dataset.lang; store.set("lang", lang); applyLang(); });

function fmt(sr){ return sr.replace("х"," × ").replace(/-/g,"–").replace(/;/g," / "); }
function intCls(i){ i=i.replace("ё","е"); return i.startsWith("лег")?"light":i.startsWith("сред")?"mid":i.startsWith("тяж")?"heavy":"drop"; }
function parseSets(sr){ const m = sr.match(/^(\d+)(?:-(\d+))?/); return m ? +(m[2]||m[1]) : 3; }

/* warmup */
function renderWarm(){
  $("warmBox").innerHTML = '<div class="tbl-wrap"><table><thead><tr>' +
    `<th>${t("wNum")}</th><th>${t("wEx")}</th><th>${t("wReps")}</th></tr></thead><tbody>` +
    WARMUP.map((w,i)=>{
      const [name, cue] = w[lang];
      const warn = cue.startsWith("!");
      const reps = w.reps.includes("|") ? w.reps.split("|")[lang==="ru"?0:1] : w.reps;
      return `<tr><td class="num">${i+1}</td><td>${name}<span class="${warn?"warn":"cue"}">${warn?cue.slice(1):cue}</span></td><td>${reps}</td></tr>`;
    }).join("") + '</tbody></table></div>';
}

/* level -> groups */
function renderGroups(){
  $("groupTitle").textContent = t("groupH",{l:lvName(state.level).toLowerCase()});
  $("groups").innerHTML = Object.keys(SPLIT).map(g=>{
    const p = SPLIT[g][state.level];
    return p ? `<button class="group" data-group="${g}"><b>${gName(g)}</b><span>${t("nEx",{n:p.length})}</span></button>`
             : `<button class="group" disabled><b>${gName(g)}</b><span>${t("noProg")}</span></button>`;
  }).join("");
  $("groups").querySelectorAll("[data-group]").forEach(x=>x.onclick=()=>{ state.group = x.dataset.group; renderWorkout(false); show("work"); });
}
document.querySelectorAll("[data-level]").forEach(b=>b.onclick=()=>{ state.level = b.dataset.level; state.group = null; renderGroups(); show("group"); });

/* workout */
function renderWorkout(keep){
  const done = keep ? [...$("exList").querySelectorAll(".set")].map(s=>s.classList.contains("done")) : [];
  const plan = SPLIT[state.group][state.level];
  $("workTitle").innerHTML = `${gName(state.group)} <span class="tag-level" style="background:${LEVEL_COLOR[state.level]};vertical-align:middle">${lvName(state.level)}</span>`;
  let idx = 0;
  $("exList").innerHTML = plan.map(([n,i,sr],k)=>{
    const circles = Array.from({length:parseSets(sr)},(_,j)=>`<button class="set${done[idx++]?" done":""}" data-ex="${k}" aria-label="${t("set",{n:j+1})}">${j+1}</button>`).join("");
    return `<li id="ex${k}"><span class="nm">${exName(n)}</span><span class="sr">${fmt(sr)}</span>
      <div class="meta"><span class="int ${intCls(i)}">${T[lang].int[intCls(i)]}</span><div class="sets">${circles}</div></div>
      <button class="tech-btn" data-tech="${k}" aria-expanded="false">${t("techShow")}</button>
      <div class="tech" id="tech${k}" hidden><ul>${(TECH[n]?TECH[n][lang]:[]).map(c=>`<li>${c}</li>`).join("")}</ul><div class="fig-box" data-name="${n}"></div>${EXFIG[n]?`<p class="mus-chips"><span>${t("working")}</span>${EXFIG[n].mus.map(m=>`<i>${MUSCLES[m][lang==="ru"?0:1]}</i>`).join("")}</p>`:""}</div></li>`;
  }).join("");
  $("exList").querySelectorAll(".set").forEach(b=>b.onclick=()=>{ b.classList.toggle("done"); markLi($("ex"+b.dataset.ex)); updProg(); });
  $("exList").querySelectorAll(".ex > li").forEach(markLi);
  $("exList").querySelectorAll(".tech-btn").forEach(b=>b.onclick=()=>{
    const p = $("tech"+b.dataset.tech), open = p.hidden;
    const box = p.querySelector(".fig-box");
    if(open && box && !box.innerHTML){ const n=box.dataset.name;
      box.innerHTML = IMG[n] ? `<img src="${IMG[n]}" alt="${exName(n)}">` : (EXFIG[n] ? FIG.render(EXFIG[n], exName(n)) : ""); }
    p.hidden = !open; b.setAttribute("aria-expanded", open);
    b.textContent = t(open ? "techHide" : "techShow");
  });
  updProg();
}
function markLi(li){ li.classList.toggle("done-li", li.querySelectorAll(".set").length === li.querySelectorAll(".set.done").length); }
function counts(){ return {a:$("exList").querySelectorAll(".set").length, d:$("exList").querySelectorAll(".set.done").length}; }
function updProg(){ $("progress").textContent = t("progress", counts()); }

/* history: локально (localStorage) + в аккаунте (db), если доступно */
const HKEY = "workout-history";
let hist = (()=>{ try{ return JSON.parse(store.get(HKEY)) || []; }catch(e){ return []; } })();
let cloud = null, clearedAt = null; // cloud = db doc ref
function saveLocal(){ store.set(HKEY, JSON.stringify(hist)); }
async function saveCloud(){ if(!cloud) return; try{ await cloud.set({items: hist, clearedAt}); }catch(e){} }
function mergeHist(a, b){
  const m = new Map(); [...a, ...b].forEach(x=>m.set(x.date, x));
  return [...m.values()].sort((x,y)=> y.date.localeCompare(x.date)).slice(0,200);
}
(async ()=>{
  if(!window.claude || !window.claude.use) return;
  try{
    const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
    if(!db || !user) return;
    const uid = await user.id(); if(!uid) return;
    const ref = db.doc("data/users/" + uid + "/workouts");
    const snap = await ref.get();
    const remote = snap.exists ? (snap.data().items || []) : [];
    clearedAt = (snap.exists && snap.data().clearedAt) || null;
    const local = clearedAt ? hist.filter(x=> x.date > clearedAt) : hist;
    hist = mergeHist(remote, local);
    cloud = ref;
    saveLocal(); renderHist();
    if(JSON.stringify(hist) !== JSON.stringify(remote)) await saveCloud();
  }catch(e){}
})();

$("finish").onclick = async ()=>{
  const {a,d} = counts();
  hist.unshift({group:state.group, level:state.level, date:new Date().toISOString(), done:d, all:a});
  hist = hist.slice(0,200);
  saveLocal(); renderHist();
  $("savedText").textContent = t("savedText",{t:workTitle(state.group,state.level), d, a});
  show("saved");
  await saveCloud();
};
function renderHist(){
  const loc = lang==="ru" ? "ru-RU" : "en-GB";
  $("histList").innerHTML = hist.length ? hist.map(x=>{
    const dt = new Date(x.date);
    const title = x.group ? workTitle(x.group, x.level) : x.title;
    return `<li><b>${title}</b><span>${dt.toLocaleDateString(loc,{day:"numeric",month:"long",year:"numeric"})}, ${dt.toLocaleTimeString(loc,{hour:"2-digit",minute:"2-digit"})}, ${t("histSets",{d:x.done,a:x.all})}</span></li>`;
  }).join("") : `<li><span>${t("histEmpty")}</span></li>`;
  $("histCount").textContent = hist.length ? t("histCount",{n:hist.length}) : "";
  $("resetBox").hidden = !hist.length;
  resetStep(false);
}
function resetStep(ask){
  $("resetBtn").hidden = ask; $("resetAsk").hidden = !ask;
}
$("resetBtn").onclick = ()=>resetStep(true);
$("resetNo").onclick = ()=>resetStep(false);
$("resetYes").onclick = async ()=>{
  hist = []; clearedAt = new Date().toISOString(); saveLocal(); renderHist();
  await saveCloud();
};
function openHist(){ renderHist(); $("drawer").classList.add("open"); $("shade").classList.add("open"); $("histClose").focus(); }
function closeHist(){ $("drawer").classList.remove("open"); $("shade").classList.remove("open"); }
$("histOpen").onclick = openHist; $("histOpen2").onclick = openHist;
$("histClose").onclick = closeHist; $("shade").onclick = closeHist;

/* author program */
function renderAuthor(){ $("authorList").innerHTML = AUTHOR.map(([n,sr])=>`<li>${exName(n)} <span>${fmt(sr)}</span></li>`).join(""); }
function toggleAuthor(open){ $("authorPop").hidden = !open; $("authorBtn").setAttribute("aria-expanded", open); }
$("authorBtn").onclick = e=>{ e.stopPropagation(); toggleAuthor($("authorPop").hidden); };
document.addEventListener("click", e=>{ if(!e.target.closest(".author")) toggleAuthor(false); });
document.addEventListener("keydown", e=>{ if(e.key==="Escape"){ closeHist(); toggleAuthor(false); } });

applyLang();
</script>
</body>
</html>
